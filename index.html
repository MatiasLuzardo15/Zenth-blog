  <!-- Una sola familia, igual que la aplicación: Inter Variable. El display es
       Inter 600 con tracking negativo manual — el sustituto de GT Walsheim que
       documenta framer/DESIGN.md. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            /* ─── Sistema Framer (framer/DESIGN.md de la app) ───
               Tokens theme-aware vía CSS vars. El oscuro es el sistema puro;
               el claro es el mismo sistema invertido. */
            canvas: 'var(--fr-canvas)',
            surface: {
              1: 'var(--fr-surface-1)',
              2: 'var(--fr-surface-2)',
            },
            ink: {
              DEFAULT: 'var(--fr-ink)',
              muted: 'var(--fr-ink-muted)',
            },
            hairline: {
              DEFAULT: 'var(--fr-hairline)',
              soft: 'var(--fr-hairline-soft)',
            },
            /* Único acento cromático: enlaces, foco y selección. Nunca relleno de marca. */
            accent: '#0099ff',
            /* Familia gradiente: sólo para spotlight cards, jamás como fondo de sección. */
            grad: {
              magenta: '#d44df0',
              violet: '#6a4cf5',
              orange: '#ff7a3d',
              coral: '#ff5577',
            },
            semantics: {
              success: '#22c55e',
              warning: '#ff7a3d',
              error: '#ff5577',
              info: '#0099ff',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Inter', 'system-ui', 'sans-serif'],
            ui: ['Inter', 'system-ui', 'sans-serif'],
            /* Alias heredados: todo converge en la misma familia. */
            serif: ['Inter', 'system-ui', 'sans-serif'],
            marker: ['Inter', 'system-ui', 'sans-serif'],
            hand: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['Inter', 'system-ui', 'sans-serif'],
          },
          borderRadius: {
            'small': '6px',
            'medium': '10px',
            'large': '15px',
            'card': '20px',
            'atmos': '30px',
            'button': '100px',
            'pill': '9999px',
          },
          boxShadow: {
            'card-resting': '0px 1px 2px rgba(0, 0, 0, 0.12)',
            'card-hover': '0px 2px 8px rgba(0, 0, 0, 0.18)',
            'floating': 'inset 0 0.5px 0 rgba(255,255,255,0.10), 0px 10px 30px rgba(0, 0, 0, 0.25)',
            'soft-lift': '0px 4px 12px rgba(0, 0, 0, 0.18)',
            'focus-ring': '0 0 0 1px rgba(0, 153, 255, 0.15)',
            'edge': 'inset 0 0.5px 0 rgba(255,255,255,0.10)',
          },
          backgroundImage: {
            'gradient-violet': 'linear-gradient(135deg, #6a4cf5 0%, #d44df0 100%)',
            'gradient-magenta': 'linear-gradient(140deg, #d44df0 0%, #ff5577 100%)',
            'gradient-orange': 'linear-gradient(140deg, #ff7a3d 0%, #ff5577 100%)',
            'gradient-coral': 'linear-gradient(140deg, #ff5577 0%, #6a4cf5 100%)',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-14px)' },
            },
            fadeUp: {
              from: { opacity: '0', transform: 'translateY(8px)' },
              to: { opacity: '1', transform: 'translateY(0)' },
            },
          },
          animation: {
            float: 'float 7s ease-in-out infinite',
            'fade-up': 'fadeUp 0.5s ease-out both',
          }
        }
      }
    }
  </script>
  <style>
    /* ══════════════════════════════════════════════════════════════
       SISTEMA FRAMER — el mismo que usa la aplicación.
       Oscuro = el sistema puro (canvas casi negro, ink blanco).
       Claro = el mismo sistema invertido: mismos radios, mismas píldoras,
       misma tipografía. Un único acento cromático (#0099ff) para enlaces,
       foco y selección — nunca como relleno de marca.
       ══════════════════════════════════════════════════════════════ */
    :root {
      --fr-canvas: #ffffff;
      --fr-surface-1: #f4f4f5;
      --fr-surface-2: #e9e9eb;
      --fr-hairline: #e2e2e4;
      --fr-hairline-soft: #efeff1;

      /* Texto: la jerarquía es binaria — ink o ink-muted */
      --fr-ink: #000000;
      --fr-ink-muted: #6b6b6b;

      /* Píldora primaria: tinta sobre canvas */
      --fr-primary: #000000;
      --fr-on-primary: #ffffff;

      --fr-accent: #0099ff;
      --fr-focus-ring: rgba(0, 153, 255, 0.15);
    }

    html.dark {
      --fr-canvas: #090909;
      --fr-surface-1: #141414;
      --fr-surface-2: #1c1c1c;
      --fr-hairline: #262626;
      --fr-hairline-soft: #1a1a1a;

      --fr-ink: #ffffff;
      --fr-ink-muted: #999999;

      /* Píldora primaria: blanco sobre oscuro. La firma de la marca. */
      --fr-primary: #ffffff;
      --fr-on-primary: #000000;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--fr-canvas);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      /* La voz del cuerpo depende de estas variantes OpenType de Inter. */
      font-feature-settings: 'cv01', 'cv05', 'cv09', 'cv11', 'ss03', 'ss07', 'dlig';
      font-optical-sizing: auto;
      letter-spacing: -0.01em;
      background-color: var(--fr-canvas);
      color: var(--fr-ink);
      transition: background-color 0.4s ease, color 0.4s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Selección y enlaces: el único momento cromático del sistema. */
    ::selection {
      background-color: rgba(0, 153, 255, 0.25);
      color: var(--fr-ink);
    }

    .fr-link {
      color: var(--fr-accent);
      text-decoration: none;
    }

    /* Canvas translúcido para la barra fija. No se puede usar el modificador
       de opacidad de Tailwind (`bg-canvas/85`): sobre un color declarado como
       `var()` genera un `rgb(var(…) / .85)` inválido y el navegador tira la
       declaración entera, dejando la barra sin fondo. */
    .bg-canvas-blur {
      background-color: var(--fr-canvas);
    }

    @supports (background-color: color-mix(in srgb, red 50%, transparent)) {
      .bg-canvas-blur {
        background-color: color-mix(in srgb, var(--fr-canvas) 86%, transparent);
      }
    }

    .fr-link:hover {
      text-decoration: underline;
    }

    *:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--fr-canvas), 0 0 0 4px rgba(0, 153, 255, 0.55);
      border-radius: 6px;
    }

    /* ─── Tipografía ───────────────────────────────────────────────
       El tracking escala con el tamaño, fuerte: display a -5% (la firma de
       la marca), cuerpo a -1%. La jerarquía la cargan tamaño + tracking, no
       rampas de peso 700/900. En móvil se reduce el TAMAÑO, nunca el
       porcentaje de tracking. */
    .font-display {
      font-weight: 600;
      letter-spacing: -0.045em;
    }

    .t-display-xxl {
      font-size: clamp(2.75rem, 7.5vw, 6.875rem);
      font-weight: 600;
      line-height: 0.85;
      letter-spacing: -0.05em;
    }

    .t-display-xl {
      font-size: clamp(2.25rem, 6vw, 5.3125rem);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .t-display-lg {
      font-size: clamp(1.875rem, 4.5vw, 3.875rem);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .t-display-md {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 600;
      line-height: 1.13;
      letter-spacing: -0.031em;
    }

    .t-headline {
      font-size: 1.375rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.036em;
    }

    .t-subhead {
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .t-body-lg {
      font-size: 1.125rem;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
    }

    .t-body {
      font-size: 0.9375rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    .t-body-sm {
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .t-caption {
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .t-micro {
      font-size: 0.75rem;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    /* Eyebrow: la etiqueta de sección. Es el único uso de tracking positivo. */
    .t-eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fr-ink-muted);
    }

    /* ─── Componentes ──────────────────────────────────────────────
       Todo CTA es una píldora. Las acciones secundarias son píldoras de
       superficie, nunca botones fantasma con borde. */
    .fr-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.01em;
      padding: 10px 18px;
      min-height: 44px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.18s ease, background-color 0.18s ease, opacity 0.18s ease;
    }

    .fr-btn:active {
      transform: scale(0.96);
    }

    .fr-btn-lg {
      font-size: 1rem;
      padding: 14px 26px;
      min-height: 52px;
    }

    .fr-btn-primary {
      background-color: var(--fr-primary);
      color: var(--fr-on-primary);
    }

    .fr-btn-primary:hover {
      opacity: 0.88;
    }

    .fr-btn-secondary {
      background-color: var(--fr-surface-1);
      color: var(--fr-ink);
    }

    .fr-btn-secondary:hover {
      background-color: var(--fr-surface-2);
    }

    .fr-btn-translucent {
      background-color: var(--fr-surface-2);
      color: var(--fr-ink);
      border-radius: 30px;
      padding: 8px 14px;
      min-height: 40px;
    }

    .fr-btn-icon {
      width: 40px;
      height: 40px;
      min-height: 40px;
      padding: 0;
      border-radius: 9999px;
      background-color: var(--fr-surface-1);
      color: var(--fr-ink);
    }

    .fr-btn-icon:hover {
      background-color: var(--fr-surface-2);
    }

    @media (pointer: coarse) {
      .fr-btn-icon {
        width: 44px;
        height: 44px;
        min-height: 44px;
      }
    }

    /* Pestañas: seleccionado = elevación de superficie, no relleno cromático. */
    .fr-tab {
      background-color: transparent;
      color: var(--fr-ink-muted);
      border-radius: 100px;
      padding: 8px 14px;
      min-height: 40px;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .fr-tab:hover {
      color: var(--fr-ink);
    }

    .fr-tab[aria-selected="true"],
    .fr-tab.is-selected {
      background-color: var(--fr-surface-2);
      color: var(--fr-ink);
    }

    .fr-input {
      background-color: var(--fr-surface-1);
      color: var(--fr-ink);
      font-size: 0.9375rem;
      line-height: 1.3;
      letter-spacing: -0.01em;
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid transparent;
      outline: none;
      transition: box-shadow 0.2s ease;
    }

    .fr-input::placeholder {
      color: var(--fr-ink-muted);
    }

    .fr-input:focus {
      box-shadow: 0 0 0 1px var(--fr-focus-ring), 0 0 0 4px rgba(0, 153, 255, 0.10);
    }

    /* Tarjetas: la jerarquía se marca con elevación de superficie
       (canvas → surface-1 → surface-2), no con opacidad sobre el texto. */
    .fr-card {
      background-color: var(--fr-surface-1);
      color: var(--fr-ink);
      border-radius: 20px;
      padding: 20px;
    }

    .fr-card-featured {
      background-color: var(--fr-surface-2);
      color: var(--fr-ink);
      border-radius: 20px;
      padding: 20px;
    }

    .fr-elevated {
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.10), 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    /* ─── Gradient spotlight cards (firma) ─────────────────────────
       Son TARJETAS, nunca fondos de sección. Una o dos por página; tres ya
       es moodboard. Radio 30px a propósito: más blando que el resto del UI. */
    .fr-spotlight {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      padding: 30px;
      color: #ffffff;
      background-image: linear-gradient(135deg, #6a4cf5 0%, #d44df0 100%);
    }

    .fr-spotlight--violet {
      background-image: linear-gradient(135deg, #6a4cf5 0%, #d44df0 100%);
    }

    .fr-spotlight--magenta {
      background-image: linear-gradient(140deg, #d44df0 0%, #ff5577 100%);
    }

    .fr-spotlight--orange {
      background-image: linear-gradient(140deg, #ff7a3d 0%, #ff5577 100%);
    }

    .fr-spotlight--coral {
      background-image: linear-gradient(140deg, #ff5577 0%, #6a4cf5 100%);
    }

    /* Rejilla de puntos: el guiño al cuaderno que sobrevive al rediseño.
       Se usa como textura de fondo puntual, no como identidad. */
    .bg-dot-grid {
      background-color: var(--fr-canvas);
      background-image: radial-gradient(var(--fr-hairline) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Barra de scroll discreta: no se oculta — esto es un blog y la barra es
       una señal de longitud del artículo. */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: var(--fr-hairline);
      border-radius: 100px;
      border: 3px solid var(--fr-canvas);
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--fr-ink-muted);
    }

    img {
      -webkit-user-drag: none;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
